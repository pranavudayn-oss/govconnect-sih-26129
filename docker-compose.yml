services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: govinterop
      POSTGRES_USER: govuser
      POSTGRES_PASSWORD: govpassword
    ports:
      - "5432:5432"
    volumes:
      - govinterop_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govuser -d govinterop"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://govuser:govpassword@db:5432/govinterop
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  govinterop_data:
